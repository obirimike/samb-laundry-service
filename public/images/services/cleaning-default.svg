<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#cleanBg)" />
  <circle cx="150" cy="90" r="130" fill="#38bdf8" opacity="0.15" />
  <circle cx="480" cy="280" r="150" fill="#60a5fa" opacity="0.12" />

  <!-- Clean room/sparkling home graphic -->
  <g transform="translate(180, 50)">
    <!-- Polished glass window / home silhouette -->
    <rect x="30" y="25" width="220" height="230" rx="20" fill="url(#glowG)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <line x1="140" y1="25" x2="140" y2="255" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <line x1="30" y1="140" x2="250" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Gleam shine across window -->
    <path d="M 60 255 L 180 25 L 210 25 L 90 255 Z" fill="#ffffff" opacity="0.08" />

    <!-- Cleaning spray bottle -->
    <g transform="translate(140, 100) scale(0.9)">
      <rect x="35" y="60" width="55" height="100" rx="14" fill="url(#sprayGrad)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.3))" />
      <rect x="42" y="45" width="41" height="15" rx="5" fill="#f8fafc" />
      <path d="M 45 45 L 35 25 L 85 25 L 85 45 Z" fill="#e2e8f0" />
      <path d="M 35 25 L 15 25 L 20 15 L 60 15 L 75 25 Z" fill="#38bdf8" />
      <path d="M 30 35 Q 20 45 28 55" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none" />
      <rect x="45" y="90" width="35" height="40" rx="6" fill="#ffffff" opacity="0.9" />
      <circle cx="62" cy="110" r="8" fill="#38bdf8" />
    </g>
  </g>

  <!-- Sparkles everywhere -->
  <path d="M 440 80 L 446 98 L 464 104 L 446 110 L 440 128 L 434 110 L 416 104 L 434 98 Z" fill="#fef08a" />
  <path d="M 120 180 L 124 193 L 137 197 L 124 201 L 120 214 L 116 201 L 103 197 L 116 193 Z" fill="#fef08a" opacity="0.85" />
  <path d="M 480 210 L 483 220 L 493 223 L 483 226 L 480 236 L 477 226 L 467 223 L 477 220 Z" fill="#93c5fd" />
  <path d="M 230 40 L 233 48 L 241 51 L 233 54 L 230 62 L 227 54 L 219 51 L 227 48 Z" fill="#ffffff" />

  <!-- Badge text -->
  <g transform="translate(40, 310)">
    <rect width="180" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROFESSIONAL CARE</text>
  </g>
</svg>
