<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="domBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowDom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#domBg)" />
  <circle cx="150" cy="100" r="140" fill="#10b981" opacity="0.15" />
  <circle cx="480" cy="270" r="160" fill="#34d399" opacity="0.12" />

  <!-- House silhouette with welcoming glow -->
  <g transform="translate(190, 60)">
    <!-- Roof -->
    <polygon points="110,20 15,100 205,100" fill="url(#glowDom)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- Walls -->
    <rect x="35" y="100" width="150" height="130" rx="10" fill="#065f46" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <!-- Door -->
    <rect x="90" y="150" width="40" height="80" rx="6" fill="#047857" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <circle cx="122" cy="190" r="3" fill="#fbbf24" />
    <!-- Windows -->
    <rect x="50" y="115" width="30" height="30" rx="4" fill="#6ee7b7" opacity="0.8" />
    <rect x="140" y="115" width="30" height="30" rx="4" fill="#6ee7b7" opacity="0.8" />
    <!-- Heart / care icon in upper window -->
    <circle cx="110" cy="65" r="14" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <path d="M 440 90 L 445 105 L 460 110 L 445 115 L 440 130 L 435 115 L 420 110 L 435 105 Z" fill="#6ee7b7" />
  <path d="M 120 190 L 123 200 L 133 203 L 123 206 L 120 216 L 117 206 L 107 203 L 117 200 Z" fill="#fef08a" />
  <path d="M 480 200 L 483 209 L 492 212 L 483 215 L 480 224 L 477 215 L 468 212 L 477 209 Z" fill="#a7f3d0" />

  <!-- Badge text -->
  <g transform="translate(40, 310)">
    <rect width="210" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">DOMESTIC SUPPORT</text>
  </g>
</svg>
