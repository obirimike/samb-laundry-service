<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="laundryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="drumGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="375" fill="url(#laundryBg)" />
  
  <!-- Subtle decorative grid & circles -->
  <circle cx="500" cy="80" r="140" fill="#38bdf8" opacity="0.12" />
  <circle cx="80" cy="320" r="160" fill="#60a5fa" opacity="0.1" />

  <!-- Washing machine / laundry graphic -->
  <g transform="translate(180, 55)">
    <!-- Main machine body -->
    <rect x="20" y="20" width="200" height="240" rx="24" fill="#ffffff" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.25))" />
    <rect x="35" y="38" width="170" height="18" rx="9" fill="#f1f5f9" />
    <!-- Buttons / dials -->
    <circle cx="55" cy="47" r="5" fill="#0284c7" />
    <circle cx="75" cy="47" r="5" fill="#38bdf8" />
    <rect x="150" y="42" width="40" height="10" rx="5" fill="#0284c7" />

    <!-- Drum outer ring -->
    <circle cx="120" cy="150" r="70" fill="#e2e8f0" />
    <circle cx="120" cy="150" r="62" fill="url(#drumGlow)" />
    <!-- Drum inner glass & water wave -->
    <circle cx="120" cy="150" r="50" fill="#0369a1" />
    <path d="M 72 155 Q 95 140 120 155 T 168 155 A 50 50 0 0 1 72 155 Z" fill="#38bdf8" opacity="0.75" />
    <circle cx="105" cy="135" r="8" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Folded clothes stack on the side -->
  <g transform="translate(380, 150)">
    <rect x="0" y="60" width="130" height="24" rx="12" fill="#93c5fd" />
    <rect x="10" y="38" width="120" height="24" rx="12" fill="#ffffff" />
    <rect x="5" y="16" width="125" height="24" rx="12" fill="#38bdf8" />
    <rect x="15" y="-6" width="115" height="24" rx="12" fill="#f8fafc" />
  </g>

  <!-- Bubbles & Sparkles -->
  <circle cx="130" cy="110" r="14" fill="url(#bubble)" />
  <circle cx="155" cy="85" r="9" fill="url(#bubble)" />
  <circle cx="430" cy="100" r="16" fill="url(#bubble)" />
  <circle cx="465" cy="75" r="10" fill="url(#bubble)" />
  <circle cx="110" cy="200" r="8" fill="url(#bubble)" />

  <path d="M 460 270 L 465 285 L 480 290 L 465 295 L 460 310 L 455 295 L 440 290 L 455 285 Z" fill="#fef08a" opacity="0.9" />
  <path d="M 120 70 L 123 80 L 133 83 L 123 86 L 120 96 L 117 86 L 107 83 L 117 80 Z" fill="#fef08a" opacity="0.8" />

  <!-- Badge text -->
  <g transform="translate(40, 310)">
    <rect width="180" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PREMIUM LAUNDRY</text>
  </g>
</svg>
