<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="pestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="glowShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#pestBg)" />
  <circle cx="150" cy="100" r="140" fill="#f59e0b" opacity="0.12" />
  <circle cx="480" cy="270" r="160" fill="#ea580c" opacity="0.1" />

  <!-- Shield protection against pests -->
  <g transform="translate(200, 60)">
    <!-- Shield -->
    <path d="M 100 20 L 180 50 C 180 140 100 210 100 210 C 100 210 20 140 20 50 Z" fill="url(#glowShield)" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" />
    <!-- Inner Shield border -->
    <path d="M 100 35 L 165 60 C 165 132 100 190 100 190 C 100 190 35 132 35 60 Z" fill="#78350f" opacity="0.7" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Checkmark / defense symbol -->
    <path d="M 70 110 L 92 132 L 135 85" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / clean defense pings -->
  <path d="M 440 90 L 445 105 L 460 110 L 445 115 L 440 130 L 435 115 L 420 110 L 435 105 Z" fill="#fbbf24" />
  <path d="M 120 190 L 123 200 L 133 203 L 123 206 L 120 216 L 117 206 L 107 203 L 117 200 Z" fill="#fed7aa" />

  <!-- Badge text -->
  <g transform="translate(40, 310)">
    <rect width="210" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PEST CONTROL DEFENSE</text>
  </g>
</svg>
